{%- component link_alternate(filename, title) -%}
	{%- if filename == "rss.xml" -%}
		{%- set type = 'type="application/rss+xml" ' -%}
	{%- elif filename == "atom.xml" -%}
		{%- set type = 'type="application/atom+xml" ' -%}
	{%- else -%}
		{%- set type = "" -%}
	{%- endif -%}
	<link rel="alternate" {{ type | safe -}} href="{{ get_url(path=filename) }}" title="{{ title | replace(from='"', to="&quot;") | safe }}">
{%- endcomponent -%}
