{% if config.extra.content_security_policy.enable == true -%}
<meta http-equiv="Content-Security-Policy" content="default-src 'self'
	{%- set connect_src = "'self'" -%}
	{%- set script_src_elem = "" -%}
	{%- set img_src = "" -%}
	{%- set style_src = "" -%}
	{%- set style_src_attr = "" -%}
	{%- set font_src = "" -%}
	{%- set other_directives = "" -%}

	{#- Allow WebSocket protocol if served via `zola serve` -#}
	{%- if config.mode == "serve" -%}
		{%- set connect_src = "'self' ws:" -%}
		{%- set script_src_elem = "'self' 'unsafe-inline'" -%}
	{%- endif -%}

	{#- Allow `data:` URL scheme if emoji-based favicon is used -#}
	{%- if config.extra.favicon_emoji -%}
		{%- set img_src = "'self' data:" -%}
	{%- endif -%}

	{#- Allow inline CSS if Zola syntax highlighting uses inline styles -#}
	{%- if config.markdown.highlighting.style == "inline" -%}
		{%- set style_src_attr = "'unsafe-inline'" -%}
	{%- endif -%}

	{#- Merge user-configured domains into the matching directive -#}
	{%- for entry in config.extra.content_security_policy.allowed_domains | default(value=[]) -%}
		{%- set entry_domains = entry.domains | join(sep=" ") -%}
		{%- if entry.directive == "connect-src" -%}
			{%- set_global connect_src = connect_src ~ " " ~ entry_domains -%}
		{%- elif entry.directive == "script-src-elem" -%}
			{%- set_global script_src_elem = script_src_elem ~ " " ~ entry_domains -%}
		{%- elif entry.directive == "img-src" -%}
			{%- set_global img_src = img_src ~ " " ~ entry_domains -%}
		{%- elif entry.directive == "style-src" -%}
			{%- set_global style_src = style_src ~ " " ~ entry_domains -%}
		{%- elif entry.directive == "style-src-attr" -%}
			{%- set_global style_src_attr = style_src_attr ~ " " ~ entry_domains -%}
		{%- elif entry.directive == "font-src" -%}
			{%- set_global font_src = font_src ~ " " ~ entry_domains -%}
		{%- else -%}
			{%- set_global other_directives = other_directives ~ "; " ~ entry.directive ~ " " ~ entry_domains -%}
		{%- endif -%}
	{%- endfor -%}

	{%- set connect_src = connect_src | trim -%}
	{%- set script_src_elem = script_src_elem | trim -%}
	{%- set img_src = img_src | trim -%}
	{%- set style_src = style_src | trim -%}
	{%- set style_src_attr = style_src_attr | trim -%}
	{%- set font_src = font_src | trim -%}

	{%- if connect_src -%}; connect-src {{ connect_src | safe }}{%- endif -%}
	{%- if script_src_elem -%}; script-src-elem {{ script_src_elem | safe }}{%- endif -%}
	{%- if img_src -%}; img-src {{ img_src | safe }}{%- endif -%}
	{%- if style_src -%}; style-src {{ style_src | safe }}{%- endif -%}
	{%- if style_src_attr -%}; style-src-attr {{ style_src_attr | safe }}{%- endif -%}
	{%- if font_src -%}; font-src {{ font_src | safe }}{%- endif -%}
	{{- other_directives | safe -}}
">
{% endif -%}
